<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your matched schemes — SarkariSahay AI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<main id="main">
  <div class="container">
    <div class="results-head">
      <h1 data-i18n="results_title"></h1>
      <p class="results-meta" id="results-meta"></p>
    </div>

    <div id="results-list"></div>
  </div>
</main>

<!-- AI-powered scheme assistant (chatbot) — only shown once schemes are
     matched; grounded on the applicant's profile + matched schemes only. -->
<button id="chat-toggle" class="chat-toggle" type="button" aria-expanded="false" aria-controls="chat-panel">
  <span class="chat-toggle__icon" aria-hidden="true">💬</span>
  <span class="chat-toggle__label" data-i18n="chat_toggle_label"></span>
</button>

<aside id="chat-panel" class="chat-panel" role="dialog" aria-label="Scheme assistant">
  <div class="chat-panel__header">
    <div>
      <strong class="chat-panel__title" data-i18n="chat_title"></strong>
      <p class="chat-panel__subtitle" data-i18n="chat_subtitle"></p>
    </div>
    <button id="chat-close" class="chat-close" type="button" aria-label="Close chat">×</button>
  </div>

  <div class="chat-suggestions">
    <button type="button" class="chat-suggestion" data-i18n="chat_q_why"></button>
    <button type="button" class="chat-suggestion" data-i18n="chat_q_best"></button>
    <button type="button" class="chat-suggestion" data-i18n="chat_q_docs"></button>
    <button type="button" class="chat-suggestion" data-i18n="chat_q_apply"></button>
  </div>

  <div id="chat-messages" class="chat-messages" aria-live="polite"></div>

  <form id="chat-form" class="chat-form">
    <input id="chat-input" type="text" data-i18n-placeholder="chat_placeholder" autocomplete="off" />
    <button type="submit" class="btn btn--primary" data-i18n="chat_send"></button>
  </form>
</aside>

<script src="js/main.js"></script>
<script src="js/api.js"></script>
<script src="js/results.js"></script>
<script src="js/chat.js"></script>
<script>SSAI.mountChrome("check");</script>
</body>
</html>
