<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Applicant details — SarkariSahay AI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<main id="main">
  <div class="container">
    <form class="form-shell" id="profile-form" novalidate>
      <div class="form-shell__head">
        <div>
          <h1 data-i18n="form_title"></h1>
          <p data-i18n="form_lede"></p>
        </div>
        <span class="form-serial" id="form-serial">FILE #—</span>
      </div>

      <div id="form-error" class="error-banner" style="display:none;"></div>

      <div class="field-row">
        <div class="field">
          <label for="age">Age</label>
          <input type="number" id="age" name="age" min="0" max="110" required placeholder="e.g. 34">
        </div>
        <div class="field">
          <label for="gender">Gender <span class="hint">(optional)</span></label>
          <select id="gender" name="gender">
            <option value="">Prefer not to say</option>
            <option value="female">Female</option>
            <option value="male">Male</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="state">State / UT</label>
          <select id="state" name="state" required></select>
        </div>
        <div class="field">
          <label for="occupation">Occupation</label>
          <select id="occupation" name="occupation" required>
            <option value="">Select one</option>
            <option value="farmer">Farmer</option>
            <option value="student">Student</option>
            <option value="salaried">Salaried / job holder</option>
            <option value="job_seeker">Job seeker / unemployed</option>
            <option value="business">Self-employed / business owner</option>
            <option value="unorganized_worker">Daily wage / unorganised worker</option>
            <option value="homemaker">Homemaker</option>
            <option value="senior_citizen">Senior citizen / retired</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="income">Annual household income (₹) <span class="hint">approx.</span></label>
          <input type="number" id="income" name="income" min="0" step="1000" placeholder="e.g. 180000">
        </div>
        <div class="field">
          <label for="category">Social category</label>
          <select id="category" name="category">
            <option value="">Not sure / prefer not to say</option>
            <option value="General">General</option>
            <option value="OBC">OBC</option>
            <option value="SC">SC</option>
            <option value="ST">ST</option>
            <option value="Minority">Minority</option>
            <option value="EWS">EWS</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn--primary" id="submit-btn" data-i18n="submit"></button>
        <span class="form-note">Nothing here is stored beyond this session.</span>
      </div>
    </form>
  </div>
</main>

<script src="js/main.js"></script>
<script src="js/api.js"></script>
<script src="js/form.js"></script>
<script>SSAI.mountChrome("check");</script>
</body>
</html>
